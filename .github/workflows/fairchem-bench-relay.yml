name: Temporary ML-PEG S3 relay for fairchem-bench

on:
  push:
    branches: [fairchem-bench-relay]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download the ML-PEG app data
        run: |
          set -euo pipefail
          mkdir -p staging/app
          curl -fsSL --retry 8 --retry-delay 10 -o data.tar.gz "https://s3.echo.stfc.ac.uk/ml-peg-data/app/data/data.tar.gz"
          ls -la data.tar.gz
          sha256sum data.tar.gz > staging/app/data.tar.gz.sha256
          tar -tzf data.tar.gz > staging/app/listing.txt
          tar -xzf data.tar.gz -C staging/app --wildcards '*metrics_table.json'
          du -sh staging/app
      - name: Push inputs to an orphan data branch
        run: |
          set -euo pipefail
          cd staging
          git init -q -b fairchem-bench-relay-data
          git add -A
          git -c user.name=relay -c user.email=relay@users.noreply.github.com commit -qm "ML-PEG S3 inputs"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:fairchem-bench-relay-appdata
